name: DTEK schedule monitor

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min (GitHub may delay runs a few minutes)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dtek-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - run: python monitor.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          QUEUES: ${{ vars.QUEUES }}
      - name: Upload debug page
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug.*
          if-no-files-found: ignore
      - name: Save state
        run: |
          git config user.name "dtek-bot"
          git config user.email "dtek-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Update schedule state" && git push)
